[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foral"
version = "0.4.0"
description = "Foral — turn the systems you already run into typed, governed MCP capabilities for your AI agents. Runs on your infrastructure; reads only, writes stay human-approved."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "agents", "integration", "contracts", "ai"]
authors = [{ name = "Foral" }]
dependencies = [
  "pydantic>=2,<3",
  "pyyaml>=6",
  "cryptography>=42",
]

# `foral login` (local session capture) needs a browser; kept OPTIONAL so `foral serve`
# stays light. Install with: pip install 'foral[login]' && playwright install chromium
[project.optional-dependencies]
login = ["playwright>=1.40"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://foral.dev"

[project.scripts]
foral = "foral.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foral"]

# sdist ENXUTO: só o essencial vai pro pacote-fonte — nada de sessions/ (T0), dist/ ou testes.
[tool.hatch.build.targets.sdist]
include = ["src/foral", "README.md", "LICENSE", "pyproject.toml"]
